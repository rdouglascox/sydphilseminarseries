- week: 6
  date: Apr 1
  fulldate: 2026-04-01
  speaker: Brian Garrett
  affiliation: ANU
  title: Remarks on Causation
  abstract: Drawing on ideas of Max Black and Michael Dummett, I outline two models of preventable backwards causation. One of these models exhibits a pre-emption structure, the other doesn’t. I then argue that agents have a reason to bring about past events on the second model but not on the first
  notes:

- week: 7
  date: Apr 15
  fulldate: 2026-04-15
  speaker: Jack Hume
  affiliation: King's College London
  title: Fairness and Value in Conservation
  abstract: Forests, species, languages, artefacts. Many parts of our world are at risk of being lost forever. With limited resources and no shortage of things worth saving, how should we allocate resources, and decide what to do? I draw on a series of case studies to help us think through what fairness requires in conservation. I argue that prominent accounts in the literature have adopted an overly proceduralist approach, that fails to account for the value of truth, justice, and the environment. I develop a substantive approach that can accommodate these values, and defend it against objections of paternalism.
  notes: 
  # jack.hume.19@ucl.ac.uk

